spring:
  application:
    name: leavewise
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

leavewise:
  # Access JWT (HS256) and refresh token lifetimes; see docs/spec/security.md
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
  # Startup seed (BR-2); compose passes these from .env
  seed:
    admin-email: ${ADMIN_EMAIL}
    admin-password: ${ADMIN_PASSWORD}
    admin-name: ${ADMIN_NAME}
    company-name: ${SEED_COMPANY_NAME}
    location-name: ${SEED_LOCATION_NAME}
    municipality: ${SEED_MUNICIPALITY}
    district: ${SEED_DISTRICT}
    country: ${SEED_COUNTRY:}
