spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leavewise}
    username: ${DB_USER:leavewise}
    password: ${DB_PASSWORD:leavewise}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:leavewise}
    password: ${RABBITMQ_PASSWORD:leavewise}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui

logging:
  level:
    org.altechego.leavewise: debug

# Same values as .env.example
leavewise:
  seed:
    admin-email: ${ADMIN_EMAIL:admin@leavewise.local}
    admin-password: ${ADMIN_PASSWORD:change-me}
    admin-name: ${ADMIN_NAME:Administrator}
    company-name: ${SEED_COMPANY_NAME:LeaveWise}
    location-name: ${SEED_LOCATION_NAME:Lisboa}
    municipality: ${SEED_MUNICIPALITY:Lisboa}
    district: ${SEED_DISTRICT:Lisboa}
